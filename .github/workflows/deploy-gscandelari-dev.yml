name: Deploy — Guilherme Dev (dev-gscandelari.web.app)

on:
  push:
    branches:
      - 'gscandelari_setup'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NODE_ENV: production
          FIREBASE_ADMIN_CREDENTIALS: ${{ secrets.FIREBASE_ADMIN_CREDENTIALS_DEV }}
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyBo23a5eTBBkfFyZ4M04gVa0HB6EAHVDUw
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: curva-mestra-dev.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: curva-mestra-dev
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: curva-mestra-dev.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: 224524575116
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:224524575116:web:b2a51e1e58469a087036a9
          NEXT_PUBLIC_USE_FIREBASE_EMULATORS: false

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Enable Firebase Web Frameworks
        run: firebase experiments:enable webframeworks

      - name: Deploy to Firebase Hosting (dev-gscandelari)
        run: |
          set -o pipefail
          firebase deploy --project curva-mestra-dev --only hosting:dev-gscandelari,firestore:rules,firestore:indexes --token "$FIREBASE_TOKEN_DEV" --force --debug 2>&1 | tee firebase-hosting-debug.log || (cat firebase-hosting-debug.log && exit 1)
        env:
          FIREBASE_TOKEN_DEV: ${{ secrets.FIREBASE_TOKEN_DEV }}
          FIREBASE_ADMIN_CREDENTIALS: ${{ secrets.FIREBASE_ADMIN_CREDENTIALS_DEV }}
          NODE_ENV: production
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyBo23a5eTBBkfFyZ4M04gVa0HB6EAHVDUw
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: curva-mestra-dev.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: curva-mestra-dev
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: curva-mestra-dev.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: 224524575116
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:224524575116:web:b2a51e1e58469a087036a9
          NEXT_PUBLIC_USE_FIREBASE_EMULATORS: false

      - name: Upload Hosting Debug Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-hosting-debug-log
          path: firebase-hosting-debug.log
          retention-days: 7

      # Apenas as functions abaixo são deployadas aqui, de propósito -- as
      # demais ainda não têm equivalente de teste seguro no projeto dev (ex.:
      # sendCustomEmail, sendTempPasswordEmail, processEmailQueue continuam de
      # fora por ora):
      # - checkAlertsScheduled não depende de secrets;
      # - onUserCreated/onTenantCreated/onAccessRequestCreated/
      #   sendAccessRejectionEmail/sendTemplateTestEmail (UC-55) dependem dos
      #   secrets SMTP_USER/SMTP_PASS, já configurados no projeto dev via
      #   `firebase functions:secrets:set` (Secret Manager habilitado).
      # - o `--force` é necessário porque, sem terminal interativo, o CLI não cria
      #   a política de limpeza de imagens do Artifact Registry e sai com erro
      #   (mesmo com a function já deployada). Ele só cria a política se ela ainda
      #   não existir. É seguro aqui: o `--only functions:<nome>` limita as functions
      #   candidatas a exclusão (planner.js do firebase-tools), então as demais
      #   functions de curva-mestra-dev, como as `ssr...` do hosting, não são tocadas.
      # O `--only functions:<nome>` sozinho NÃO basta: o CLI carrega o código inteiro
      # e valida os secrets de TODAS as functions descobertas, falhando com "Secret
      # Manager API has not been used in project curva-mestra-dev" para qualquer
      # function cujo secret não esteja configurado. Por isso, só neste deploy, o
      # entrypoint compilado (lib/index.js, gitignored) é trocado por um que exporta
      # apenas as functions abaixo -- functions/src/index.ts não é alterado.
      # Para incluir outra function: exporte-a no lib/index.js abaixo E acrescente
      # `,functions:<nome>` ao --only (e configure o secret no projeto dev primeiro,
      # se ela usar algum).
      - name: Install Functions dependencies and build
        run: |
          cd functions
          npm ci
          npx tsc
          {
            echo "exports.checkAlertsScheduled = require('./checkAlertsScheduled').checkAlertsScheduled;"
            echo "exports.onUserCreated = require('./onUserCreated').onUserCreated;"
            echo "exports.onTenantCreated = require('./onTenantCreated').onTenantCreated;"
            echo "exports.onAccessRequestCreated = require('./onAccessRequestCreated').onAccessRequestCreated;"
            echo "exports.sendAccessRejectionEmail = require('./sendRejectionEmail').sendAccessRejectionEmail;"
            echo "exports.sendTemplateTestEmail = require('./sendTemplateTestEmail').sendTemplateTestEmail;"
          } > lib/index.js

      - name: Deploy Scheduled Functions (dev-gscandelari)
        run: |
          set -o pipefail
          firebase deploy --project curva-mestra-dev --only functions:checkAlertsScheduled,functions:onUserCreated,functions:onTenantCreated,functions:onAccessRequestCreated,functions:sendAccessRejectionEmail,functions:sendTemplateTestEmail --token "$FIREBASE_TOKEN_DEV" --force --debug 2>&1 | tee firebase-functions-debug.log || (cat firebase-functions-debug.log && exit 1)
        env:
          FIREBASE_TOKEN_DEV: ${{ secrets.FIREBASE_TOKEN_DEV }}

      - name: Upload Functions Debug Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-functions-debug-log
          path: firebase-functions-debug.log
          retention-days: 7

      - name: Deployment Summary
        run: |
          echo "Deploy concluido: https://dev-gscandelari.web.app"
          echo "Projeto Firebase: curva-mestra-dev (isolado de producao)"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
